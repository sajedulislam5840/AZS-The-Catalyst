<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="Architecture: students and the admin use the Next.js app on Vercel, which talks to the FastAPI backend on Render, which uses Neon PostgreSQL and the Groq language model. Lectures come from YouTube and sheets from Google Drive.">
<title>AZS architecture</title>
<defs><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style></defs>
<rect width="1100" height="470" rx="22" fill="#F3F8FC"/>
<rect x="1" y="1" width="1098" height="468" rx="21" fill="none" stroke="#D3E3EF" stroke-width="2"/>
<text x="40" y="52" style="font:800 20px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#075985">How a request travels</text>
<text x="40" y="76" style="font:500 13px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#64748B">Moving dots are requests. Every API call carries the user&apos;s sign-in token.</text>
