eight="90" rx="16" fill="#FFFFFF" stroke="#CC310E" stroke-width="2"/><text x="785.0" y="81.0" text-anchor="middle" style="font:800 17px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#CC310E">Groq LLM</text><text x="785.0" y="103.0" text-anchor="middle" style="font:500 13px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#475569">AI tutor, fast and deep</text></g><g><rect x="670" y="370" width="230" height="80" rx="16" fill="#FFFFFF" stroke="#075985" stroke-width="2"/><text x="785.0" y="406.0" text-anchor="middle" style="font:800 17px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#075985">Neon PostgreSQL</text><text x="785.0" y="428.0" text-anchor="middle" style="font:500 13px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#475569">users, progress, payments</text></g><g><rect x="330" y="98" width="230" height="80" rx="16" fill="#FFFFFF" stroke="#BBD2E3" stroke-width="2"/><text x="445.0" y="134.0" text-anchor="middle" style="font:800 17px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#075985">YouTube</text><text x="445.0" y="156.0" text-anchor="middle" style="font:500 13px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#475569">lectures play in the browser</text></g><g><rect x="330" y="380" width="230" height="80" rx="16" fill="#FFFFFF" stroke="#BBD2E3" stroke-width="2"/><text x="445.0" y="416.0" text-anchor="middle" style="font:800 17px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#075985">Google Drive</text><text x="445.0" y="438.0" text-anchor="middle" style="font:500 13px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#475569">study sheets open in a preview</text></g>
<g style="font:500 12px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#64748B"><text x="40" y="430">The backend stores links only.</text><text x="40" y="446">Videos and sheets load straight</text><text x="40" y="462">from YouTube and Google Drive.</text></g>
</svg>