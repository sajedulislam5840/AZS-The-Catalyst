version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: edutrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edutrack
      POSTGRES_PASSWORD: edutrack_secret
      POSTGRES_DB: edutrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: edutrack_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edutrack_backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data: